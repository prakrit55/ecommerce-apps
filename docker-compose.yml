version: '3.8'

services:
  # ==========================================
  # 🗄️ Database Services
  # ==========================================

  postgres:
    image: postgres:15-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb:
    image: mongo:6.0
    container_name: ecom-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecom-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 🚀 Microservices Application Services
  # ==========================================

  product-catalog:
    build:
      context: ./product-catalog-code
      dockerfile: Dockerfile
    container_name: product-catalog-service
    restart: unless-stopped
    ports:
      - "${PRODUCT_CATALOG_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017/product_catalog
      - REDIS_URL=redis://redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ecom-network

  product-inventory:
    build:
      context: ./product-inventory-src
      dockerfile: Dockerfile
    container_name: product-inventory-service
    restart: unless-stopped
    ports:
      - "${PRODUCT_INVENTORY_PORT:-3002}:3002"
    environment:
      - PORT=3002
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecom-network

  shipping-handling:
    build:
      context: ./shipping-and-handling-src
      dockerfile: Dockerfile
    container_name: shipping-handling-service
    restart: unless-stopped
    ports:
      - "${SHIPPING_HANDLING_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecom-network

  contact-support:
    build:
      context: ./contact-support-team-src
      dockerfile: Dockerfile
    container_name: contact-support-service
    restart: unless-stopped
    ports:
      - "${CONTACT_SUPPORT_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecom-network

  order-management:
    build:
      context: ./order-management-code
      dockerfile: Dockerfile
    container_name: order-management-service
    restart: unless-stopped
    ports:
      - "${ORDER_MANAGEMENT_PORT:-9090}:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-postgres}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - PRODUCT_INVENTORY_API_HOST=http://product-inventory
      - PRODUCT_CATALOG_API_HOST=http://product-catalog
      - SHIPPING_HANDLING_API_HOST=http://shipping-handling
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgres:
        condition: service_healthy
      product-inventory:
        condition: service_started
      product-catalog:
        condition: service_started
      shipping-handling:
        condition: service_started
    networks:
      - ecom-network

  ecommerce-ui:
    build:
      context: ./ecommerce-ui-code
      dockerfile: Dockerfile
    container_name: ecommerce-ui-service
    restart: unless-stopped
    ports:
      - "${UI_PORT:-4000}:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=4000
      - REACT_APP_PRODUCT_API_HOST=http://product-catalog
      - REACT_APP_INVENTORY_API_HOST=http://product-inventory
      - REACT_APP_ORDER_API_HOST=http://order-management
      - REACT_APP_SHIPPING_API_HOST=http://shipping-handling
      - REACT_APP_CONTACT_API_HOST=http://contact-support
      - REACT_APP_PROFILE_API_HOST=${REACT_APP_PROFILE_API_HOST:-http://contact-support}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      - product-catalog
      - product-inventory
      - order-management
      - shipping-handling
      - contact-support
    networks:
      - ecom-network

  # ==========================================
  # 📊 Observability Services
  # ==========================================

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: ecom-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9092}:9090"
    volumes:
      - ./docker-compose/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./docker-compose/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml
    networks:
      - ecom-network

  grafana:
    image: grafana/grafana:latest
    container_name: ecom-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker-compose/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - ecom-network

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  grafana_data:

networks:
  ecom-network:
    driver: bridge
