name: E-Commerce Services CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  GAR_LOCATION: us-central1
  GCP_PROJECT_ID: k8s-staging-252732

permissions:
  contents: read
  id-token: write

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter-services.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ecommerce-ui: 'ecommerce-ui-code/**'
            contact-support: 'contact-support-team-src/**'
            order-management: 'order-management-code/**'
            product-catalog-code: 'product-catalog-code/**'
            product-catalog-src: 'product-catalog-src/**'
            product-inventory: 'product-inventory-src/**'
            shipping-handling: 'shipping-and-handling-src/**'

      - name: Generate Services Matrix
        id: filter-services
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SERVICES_JSON='["ecommerce-ui", "contact-support", "order-management", "product-catalog-code", "product-catalog-src", "product-inventory", "shipping-handling"]'
          else
            SERVICES_JSON='${{ steps.filter.outputs.changes }}'
          fi
          echo "services=$SERVICES_JSON" >> $GITHUB_OUTPUT
        shell: bash

  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: 'projects/898698082979/locations/global/workloadIdentityPools/loki-test-pool/providers/github-provider'
          service_account: 'loki-test-pusher@k8s-staging-252732.iam.gserviceaccount.com'

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set service details
        id: details
        run: |
          SERVICE="${{ matrix.service }}"
          if [ "$SERVICE" = "ecommerce-ui" ]; then
            echo "dir=./ecommerce-ui-code" >> $GITHUB_OUTPUT
            echo "file=./ecommerce-ui-code/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=ecommerce-ui" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "contact-support" ]; then
            echo "dir=./contact-support-team-src" >> $GITHUB_OUTPUT
            echo "file=./contact-support-team-src/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=contact-support" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "order-management" ]; then
            echo "dir=./order-management-code" >> $GITHUB_OUTPUT
            echo "file=./order-management-code/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=order-management" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "product-catalog-code" ]; then
            echo "dir=./product-catalog-code" >> $GITHUB_OUTPUT
            echo "file=./product-catalog-code/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=product-catalog" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "product-catalog-src" ]; then
            echo "dir=./product-catalog-src" >> $GITHUB_OUTPUT
            echo "file=./product-catalog-src/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=product-catalog" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "product-inventory" ]; then
            echo "dir=./product-inventory-src" >> $GITHUB_OUTPUT
            echo "file=./product-inventory-src/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=product-inventory" >> $GITHUB_OUTPUT
          elif [ "$SERVICE" = "shipping-handling" ]; then
            echo "dir=./shipping-and-handling-src" >> $GITHUB_OUTPUT
            echo "file=./shipping-and-handling-src/Dockerfile" >> $GITHUB_OUTPUT
            echo "image=shipping-handling" >> $GITHUB_OUTPUT
          fi
        shell: bash

      # Run UI Tests / Build
      - name: Setup Node.js
        if: matrix.service == 'ecommerce-ui'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './ecommerce-ui-code/client/package-lock.json'

      - name: Build UI client
        if: matrix.service == 'ecommerce-ui'
        run: |
          npm ci --legacy-peer-deps
          npm run build
        env:
          CI: false
        working-directory: ./ecommerce-ui-code/client

      - name: Install UI server dependencies
        if: matrix.service == 'ecommerce-ui'
        run: npm ci
        working-directory: ./ecommerce-ui-code/server

      # Run Java (Order Management) Tests
      - name: Setup JDK 17
        if: matrix.service == 'order-management'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Start PostgreSQL for Tests
        if: matrix.service == 'order-management'
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_DB=postgres -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres postgres:15
          for i in {1..30}; do
            if docker exec postgres pg_isready; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            echo "Waiting for PostgreSQL..."
            sleep 1
          done
          echo "PostgreSQL failed to start"
          exit 1

      - name: Run Maven Tests
        if: matrix.service == 'order-management'
        run: mvn clean test
        working-directory: ./order-management-code

      # Run Go (Shipping & Handling) Compile Check
      - name: Setup Go
        if: matrix.service == 'shipping-handling'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: './shipping-and-handling-src/go.sum'

      - name: Build Go Application
        if: matrix.service == 'shipping-handling'
        run: go build -v ./...
        working-directory: ./shipping-and-handling-src

      # Build & Push Docker image
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ steps.details.outputs.image }}/${{ steps.details.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.details.outputs.dir }}
          file: ${{ steps.details.outputs.file }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
