apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-inventory
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: product-inventory
          image: product-inventory:dev
          resources:
            requests:
              cpu: 2m
              memory: 29Mi
            limits:
              cpu: 100m
              memory: 128Mi
