apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecom-dev

resources:
  - ../../base
  - secret.yaml
  # - vpa.yaml

patches:
  - path: config-patch.yaml
  - path: postgres-db.yaml
  - path: mongodb.yaml
  - path: redis.yaml
  - path: product-catalog.yaml
  - path: product-inventory.yaml
  - path: order-management.yaml
  - path: shipping-handling.yaml
  - path: contact-support.yaml
  - path: ecommerce-ui.yaml

images:
  - name: contact-support
    newName: 271643857832.dkr.ecr.ap-south-1.amazonaws.com/contact-support
