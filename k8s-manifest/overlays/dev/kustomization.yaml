    newTag: latest
  - name: order-management
    newName: 271643857832.dkr.ecr.ap-south-1.amazonaws.com/order-management
    newTag: latest
  - name: product-catalog
    newName: 271643857832.dkr.ecr.ap-south-1.amazonaws.com/product-catalog-code
    newTag: latest
  - name: product-inventory
    newName: 271643857832.dkr.ecr.ap-south-1.amazonaws.com/product-inventory
    newTag: latest
  - name: shipping-handling
    newName: 271643857832.dkr.ecr.ap-south-1.amazonaws.com/shipping-handling
    newTag: latest
