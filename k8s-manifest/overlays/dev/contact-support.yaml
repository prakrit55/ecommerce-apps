apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-support
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: contact-support
          image: contact-support:dev
          resources:
            requests:
              cpu: 2m
              memory: 39Mi
            limits:
              cpu: 100m
              memory: 128Mi
