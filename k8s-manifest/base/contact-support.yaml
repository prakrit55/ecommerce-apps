apiVersion: apps/v1
kind: Deployment
metadata:
  name: contact-support
  labels:
    app: contact-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contact-support
  template:
    metadata:
      labels:
        app: contact-support
    spec:
      containers:
        - name: contact-support
          image: contact-support
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ecom-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecom-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ecom-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: postgres-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ecom-secrets
                  key: postgres-password
---
apiVersion: v1
kind: Service
metadata:
  name: contact-support-service
spec:
  selector:
    app: contact-support
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
